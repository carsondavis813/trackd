{% extends 'base.html' %}
{% block title %}Log In{% endblock %}
{% block content %}
<section class="account-layout account-layout-small">
  <div class="account-intro"><div class="kicker">YOUR TRACKD</div><h1>Welcome back<span class="green-dot">.</span></h1></div>
  <form method="post" class="account-form">
    <label for="username">Username</label><input id="username" name="username" required autocomplete="username">
    <label for="password">Password</label><input id="password" name="password" required type="password" autocomplete="current-password">
    <button class="primary-button" type="submit">Log in</button>
    <p class="account-switch">New to Trackd? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
